# Runs on pull requests, so it must never gain a secret. gitleaks is a checksummed binary, not the
# action, which needs a licence key for organisations. SHA-512 was computed from the archive whose
# SHA-256 matched gitleaks_8.30.1_checksums.txt in the release.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA512: 3bda5e60075b78c2fca299805a3d6cfcca1398ba6ebae648bc63f0e2329f3d68bbcc1b029f3f0deedaadaf8594c8159db46df3de0d2d55446c615e58d3c5a353
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install gitleaks
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA512  $RUNNER_TEMP/$archive" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .github/gitleaks.toml --redact --no-banner \
            --exit-code 1 --report-format json --report-path gitleaks-report.json
      - name: Run the local rules as well
        run: node scripts/check-secrets.mjs
      - name: Check the public manifest holds known fields only
        run: node scripts/check-manifest-public.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gitleaks-${{ github.sha }}-${{ github.run_attempt }}
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30

  workflow-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-workflows.mjs --self-test
      - run: node scripts/check-workflows.mjs
